<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Portal — NEG+ Innovations, Inc.</title>
    <style>
        :root {
            --black:       #1B263B;
            --gold:        #41B3A3;
            --gold-dark:   #2A9D8F;
            --gold-light:  #7DD3CB;
            --brown-dark:  #0E2A47;
            --brown-light: #778DA9;
            --cream:       #E8EEF4;
            --cream-dark:  #D8E3EE;
            --white:       #FFFFFF;
            --text-dark:   #1B263B;
            --text-mid:    #4A6580;
            --ms-blue:     #0078D4;
            --ms-blue-dark:#005A9E;
            --input-bg:    rgba(255,255,255,0.06);
            --input-border:rgba(65,179,163,0.25);
            --input-focus: rgba(65,179,163,0.55);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { overflow-x: hidden; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--black) 0%, var(--brown-dark) 60%, #0a1e35 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ── NAV ── */
        nav {
            background: rgba(27,38,59,0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(65,179,163,0.25);
            position: relative;
            z-index: 10;
        }
        .nav-inner {
            max-width: 1280px; margin: 0 auto; padding: 0 2rem;
            display: flex; align-items: center; justify-content: space-between;
            height: 68px;
        }
        .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .nav-logo-img { display: block; height: 40px; width: auto; }
        .nav-back {
            font-size: 0.8rem; font-weight: 600; color: var(--gold-light);
            text-decoration: none; text-transform: uppercase; letter-spacing: 0.6px;
            display: flex; align-items: center; gap: 6px;
            transition: color 0.2s;
        }
        .nav-back:hover { color: var(--white); }
        .nav-back svg { flex-shrink: 0; }

        /* ── LOGIN WRAPPER ── */
        .login-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
        }

        /* ── CARD ── */
        .login-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(65,179,163,0.2);
            border-radius: 20px;
            padding: 3rem 2.5rem 2.5rem;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 24px 64px rgba(0,0,0,0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .login-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(65,179,163,0.12);
            border: 1px solid rgba(65,179,163,0.3);
            border-radius: 50px;
            padding: 5px 16px;
            font-size: 0.68rem; font-weight: 700; letter-spacing: 1.8px;
            text-transform: uppercase; color: var(--gold-light);
            margin-bottom: 1.5rem;
        }
        .login-badge svg { flex-shrink: 0; }

        .login-card h1 {
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 800;
            color: var(--white);
            line-height: 1.2;
            margin-bottom: 0.6rem;
        }
        .login-card h1 span { color: var(--gold); }

        .login-card .subtitle {
            font-size: 0.88rem;
            color: rgba(255,255,255,0.5);
            line-height: 1.65;
            margin-bottom: 2.25rem;
        }

        .divider-line {
            width: 40px; height: 3px;
            background: var(--gold);
            border-radius: 2px;
            margin: 0 auto 2.25rem;
        }

        /* ── FORM ── */
        .login-form { display: flex; flex-direction: column; gap: 1rem; text-align: left; }

        .field-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .field-label {
            font-size: 0.72rem; font-weight: 700; letter-spacing: 0.8px;
            text-transform: uppercase; color: rgba(255,255,255,0.45);
        }
        .field-wrap { position: relative; }
        .field-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            padding: 0.82rem 1rem;
            font-size: 0.95rem;
            color: var(--white);
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
            -webkit-appearance: none;
        }
        .field-input::placeholder { color: rgba(255,255,255,0.2); }
        .field-input:focus {
            border-color: var(--input-focus);
            background: rgba(255,255,255,0.09);
            box-shadow: 0 0 0 3px rgba(65,179,163,0.12);
        }
        .field-suffix {
            position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);
            font-size: 0.8rem; color: rgba(255,255,255,0.25); pointer-events: none;
        }
        .toggle-pw {
            position: absolute; right: 0.85rem; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer; padding: 4px;
            color: rgba(255,255,255,0.3); transition: color 0.2s; line-height: 0;
        }
        .toggle-pw:hover { color: var(--gold-light); }

        .btn-signin {
            display: flex; align-items: center; justify-content: center;
            width: 100%; margin-top: 0.5rem;
            background: var(--gold);
            color: var(--black) !important;
            border: none; border-radius: 10px; cursor: pointer;
            padding: 0.95rem 1.5rem;
            font-size: 0.97rem; font-weight: 800; font-family: inherit;
            letter-spacing: 0.3px;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(65,179,163,0.3);
        }
        .btn-signin:hover {
            background: var(--gold-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(65,179,163,0.35);
        }
        .btn-signin:active { transform: translateY(0); }

        .login-note {
            margin-top: 1.25rem;
            font-size: 0.72rem;
            color: rgba(255,255,255,0.3);
            line-height: 1.6;
        }
        .login-note a {
            color: var(--gold-light);
            text-decoration: none;
        }
        .login-note a:hover { text-decoration: underline; }

        .login-security {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(65,179,163,0.12);
            font-size: 0.7rem;
            color: rgba(255,255,255,0.22);
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }

        /* ── FOOTER ── */
        footer {
            text-align: center;
            padding: 1.5rem 2rem;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.2);
        }
        footer a { color: rgba(65,179,163,0.6); text-decoration: none; }
        footer a:hover { color: var(--gold-light); }

        /* ── RESPONSIVE ── */
        @media (max-width: 480px) {
            .login-card { padding: 2.25rem 1.5rem 2rem; border-radius: 16px; }
            .login-wrap { padding: 2rem 1rem; }
        }
    </style>
    <link rel="icon" href="favicon.png" type="image/png">
    <meta name="robots" content="noindex, nofollow">
</head>
<body>

<!-- ── NAV ── -->
<nav>
    <div class="nav-inner">
        <a class="nav-logo" href="index.html">
            <img src="logo.svg" alt="NEG+ Innovations, Inc." class="nav-logo-img" height="40">
        </a>
        <a href="index.html" class="nav-back">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M9 11L5 7l4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Back to site
        </a>
    </div>
</nav>

<!-- ── LOGIN ── -->
<div class="login-wrap">
    <div class="login-card">

        <div class="login-badge">
            <svg width="10" height="12" viewBox="0 0 10 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="1" y="5" width="8" height="6.5" rx="1.5" stroke="#7DD3CB" stroke-width="1.3"/>
                <path d="M3 5V3.5a2 2 0 0 1 4 0V5" stroke="#7DD3CB" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            Internal Access Only
        </div>

        <h1>NEG<span>+</span> Employee Portal</h1>
        <p class="subtitle">Sign in with your @negplus.com account.</p>
        <div class="divider-line"></div>

        <form class="login-form" onsubmit="handleLogin(event)">
            <div class="field-group">
                <label class="field-label" for="username">Username</label>
                <div class="field-wrap">
                    <input class="field-input" id="username" type="text"
                           placeholder="name" autocomplete="username"
                           autocapitalize="none" spellcheck="false" required>
                    <span class="field-suffix">@negplus.com</span>
                </div>
            </div>
            <div class="field-group">
                <label class="field-label" for="password">Password</label>
                <div class="field-wrap">
                    <input class="field-input" id="password" type="password"
                           placeholder="••••••••" autocomplete="current-password" required
                           style="padding-right:2.75rem;">
                    <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
                        <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-signin">Sign In</button>
        </form>

        <p class="login-note" style="margin-top:1.25rem;">
            Forgot your password? <a href="mailto:admin@negplus.com">Contact IT</a>
        </p>

        <div class="login-security">
            <svg width="11" height="13" viewBox="0 0 11 13" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M5.5 1L1 3v3.5C1 9.3 3 11.6 5.5 12.5 8 11.6 10 9.3 10 6.5V3L5.5 1Z" stroke="rgba(255,255,255,0.25)" stroke-width="1.2" stroke-linejoin="round"/>
            </svg>
            Secured · Internal access only
        </div>

    </div>
</div>

<!-- ── FOOTER ── -->
<footer>
    <p>© 2026 NEG+ Innovations, Inc. &nbsp;·&nbsp; <a href="index.html">Return to website</a> &nbsp;·&nbsp; <a href="disclaimer.html">Disclaimer</a></p>
</footer>

<script>
(function() {
    var pw    = document.getElementById('password');
    var btn   = document.getElementById('togglePw');
    var icon  = document.getElementById('eyeIcon');
    var eyeOn  = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    var eyeOff = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
    btn.addEventListener('click', function() {
        var show = pw.type === 'password';
        pw.type = show ? 'text' : 'password';
        icon.innerHTML = show ? eyeOff : eyeOn;
        btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });
})();

function handleLogin(e) {
    e.preventDefault();
    var user = document.getElementById('username').value.trim();
    var hint = encodeURIComponent(user + '@negplus.com');
    window.location.href = 'https://login.microsoftonline.com?login_hint=' + hint;
}
</script>
</body>
</html>
