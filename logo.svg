<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 264 52" width="264" height="52" role="img" aria-label="NEG+ Innovations">
  <!-- Brand mark (actual logo extracted from brand assets) -->
  <image href="data:image/png;base64," x="0" y="2" width="47" height="48" preserveAspectRatio="xMidYMid meet"/>

  <!-- NEG+ text -->
  <text x="58" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5" fill="#0f5c52">NEG</text>
  <text x="122" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#c9932c">+</text>

  <!-- Teal rule -->
  <rect x="58" y="37" width="100" height="1.5" rx="0.75" fill="#41B3A3" opacity="0.5"/>

  <!-- INNOVATIONS -->
  <text x="58" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="2.2" fill="#41B3A3">INNOVATIONS</text>
