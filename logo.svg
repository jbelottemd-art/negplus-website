  <!-- Figure — gold strand -->
  <path d="M28,10 C18,20 36,32 28,44 C22,50 34,53 30,48" fill="none" stroke="#c9932c" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Figure — teal strand -->
