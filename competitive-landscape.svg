  </g>
  <text x="104" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF">Pudendal Nerve Block — Alternatives</text>

