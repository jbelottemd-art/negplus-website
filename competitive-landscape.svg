  <text x="298" y="648" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="8.5" font-weight="700" fill="#6B7C93" letter-spacing="1.8" text-anchor="middle">SKILL REQUIRED →</text>

