  <text x="48" y="694" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" font-style="italic">The moat:</text>
  <text x="130" y="694" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.92)"> two purpose-built devices in two empty quadrants — protected by IP, regulatory pathway, and workflow simplicity.</text>

  <!-- Bottom info line -->
  <text x="48" y="740" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9" fill="#9AA5B4">NEG-PITCH-CMP-2026-002 · Slide 09 / Competitive Landscape</text>
  <text x="1232" y="740" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9" fill="#9AA5B4" text-anchor="end">© 2026 NEG+ Innovations, Inc.</text>
