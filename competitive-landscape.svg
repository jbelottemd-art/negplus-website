<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 310" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="hdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0E2A47"/>
      <stop offset="100%" style="stop-color:#1B3F5C"/>
    </linearGradient>
    <linearGradient id="ftr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#41B3A3"/>
      <stop offset="100%" style="stop-color:#2A9D8F"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="rgba(65,179,163,0.8)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="540" height="310" fill="#F4F7FA"/>

  <!-- ══════════════════════════════════════
       LEFT CHART — Pudendal Nerve Block
       x: 0–262, y: 0–256
  ══════════════════════════════════════ -->
  <rect x="0" y="0" width="262" height="256" fill="#fff" stroke="#D8E2EC" stroke-width="0.8"/>

  <!-- Navy header -->
  <rect x="0" y="0" width="262" height="38" fill="url(#hdr)"/>
  <text x="10" y="14" font-family="'Segoe UI',Arial,sans-serif" font-size="7.5" font-weight="700" fill="#7DD3CB" letter-spacing="1.5">PUDENDAL NERVE BLOCK</text>
  <text x="10" y="28" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="800" fill="#fff">Alternatives</text>

  <!-- Axis lines -->
  <line x1="30" y1="38" x2="30" y2="248" stroke="#B0BEC5" stroke-width="0.7"/>
  <line x1="30" y1="248" x2="255" y2="248" stroke="#B0BEC5" stroke-width="0.7"/>

  <!-- Axis labels -->
  <text x="18" y="145" font-family="'Segoe UI',Arial,sans-serif" font-size="7" font-weight="600" fill="#7A8FA6" text-anchor="middle" transform="rotate(-90,18,145)">↑ COST PER CASE</text>
  <text x="142" y="258" font-family="'Segoe UI',Arial,sans-serif" font-size="7" font-weight="600" fill="#7A8FA6" text-anchor="middle">SKILL REQUIRED →</text>

  <!-- Quadrant dividers -->
  <line x1="30" y1="143" x2="255" y2="143" stroke="#B0BEC5" stroke-width="0.7" stroke-dasharray="3,2"/>
  <line x1="142" y1="38" x2="142" y2="248" stroke="#B0BEC5" stroke-width="0.7" stroke-dasharray="3,2"/>

  <!-- White space fill (bottom-left) -->
  <rect x="30" y="143" width="112" height="105" fill="#DDF2EF"/>
  <text x="37" y="157" font-family="'Segoe UI',Arial,sans-serif" font-size="7.5" font-weight="700" fill="#2A9D8F" font-style="italic" letter-spacing="1">WHITE SPACE</text>

  <!-- hi/lo -->
  <text x="252" y="50" font-family="'Segoe UI',Arial,sans-serif" font-size="6.5" fill="#9EADB8" text-anchor="end" font-style="italic">high</text>
  <text x="34" y="247" font-family="'Segoe UI',Arial,sans-serif" font-size="6.5" fill="#9EADB8" font-style="italic">low</text>

  <!-- Competitors -->
  <!-- Local infiltration: top-left (low skill, high cost) -->
  <circle cx="78" cy="82" r="9" fill="#8796A5"/>
  <text x="91" y="78" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#2D3748">Local</text>
  <text x="91" y="89" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#2D3748">infiltration</text>

  <!-- Neuraxial/epidural: top-right (high skill, very high cost) -->
  <circle cx="230" cy="58" r="11" fill="#4A5568"/>
  <text x="215" y="52" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#2D3748" text-anchor="middle">Neuraxial /</text>
  <text x="215" y="63" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#2D3748" text-anchor="middle">epidural</text>

  <!-- Ultrasound-guided PNB: right, mid-high cost -->
  <circle cx="210" cy="110" r="9" fill="#4A5568"/>
  <text x="197" y="103" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#2D3748" text-anchor="middle">Ultrasound</text>
  <text x="197" y="114" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#2D3748" text-anchor="middle">PNB</text>

  <!-- Iowa trumpet: bottom-right (high skill, low cost) -->
  <circle cx="200" cy="198" r="8" fill="#8796A5"/>
  <text x="188" y="215" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#2D3748" text-anchor="middle">Iowa trumpet</text>
  <text x="188" y="226" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#2D3748" text-anchor="middle">(landmark)</text>

  <!-- NEG+ PNB Device: bottom-left WHITE SPACE -->
  <circle cx="74" cy="200" r="11" fill="#41B3A3" filter="url(#glow)"/>
  <circle cx="74" cy="200" r="5" fill="#fff"/>
  <text x="90" y="196" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" font-weight="700" fill="#0E2A47">PNB Device™</text>


  <!-- ══════════════════════════════════════
       RIGHT CHART — Colpotomy
       x: 278–540, y: 0–256
  ══════════════════════════════════════ -->
  <rect x="278" y="0" width="262" height="256" fill="#fff" stroke="#D8E2EC" stroke-width="0.8"/>

  <!-- Navy header -->
  <rect x="278" y="0" width="262" height="38" fill="url(#hdr)"/>
  <text x="288" y="14" font-family="'Segoe UI',Arial,sans-serif" font-size="7.5" font-weight="700" fill="#7DD3CB" letter-spacing="1.5">COLPOTOMY</text>
  <text x="288" y="28" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="800" fill="#fff">Alternatives</text>

  <!-- Axis lines -->
  <line x1="308" y1="38" x2="308" y2="248" stroke="#B0BEC5" stroke-width="0.7"/>
  <line x1="308" y1="248" x2="533" y2="248" stroke="#B0BEC5" stroke-width="0.7"/>

  <!-- Axis labels -->
  <text x="296" y="145" font-family="'Segoe UI',Arial,sans-serif" font-size="7" font-weight="600" fill="#7A8FA6" text-anchor="middle" transform="rotate(-90,296,145)">↑ COST PER CASE</text>
  <text x="420" y="258" font-family="'Segoe UI',Arial,sans-serif" font-size="7" font-weight="600" fill="#7A8FA6" text-anchor="middle">SKILL REQUIRED →</text>

  <!-- Quadrant dividers -->
  <line x1="308" y1="143" x2="533" y2="143" stroke="#B0BEC5" stroke-width="0.7" stroke-dasharray="3,2"/>
  <line x1="420" y1="38" x2="420" y2="248" stroke="#B0BEC5" stroke-width="0.7" stroke-dasharray="3,2"/>

  <!-- White space fill (bottom-left) -->
  <rect x="308" y="143" width="112" height="105" fill="#DDF2EF"/>
  <text x="315" y="157" font-family="'Segoe UI',Arial,sans-serif" font-size="7.5" font-weight="700" fill="#2A9D8F" font-style="italic" letter-spacing="1">WHITE SPACE</text>

  <!-- hi/lo -->
  <text x="530" y="50" font-family="'Segoe UI',Arial,sans-serif" font-size="6.5" fill="#9EADB8" text-anchor="end" font-style="italic">high</text>
  <text x="312" y="247" font-family="'Segoe UI',Arial,sans-serif" font-size="6.5" fill="#9EADB8" font-style="italic">low</text>

  <!-- Competitors -->
  <!-- Robotic Da Vinci: top-right, very high cost -->
  <circle cx="510" cy="55" r="11" fill="#4A5568"/>
  <text x="495" y="48" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#2D3748" text-anchor="middle">Robotic</text>
  <text x="495" y="59" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#2D3748" text-anchor="middle">(Da Vinci)</text>

  <!-- Open colpotomy TAH: right, high cost -->
  <circle cx="476" cy="100" r="9" fill="#8796A5"/>
  <text x="461" y="93" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#2D3748" text-anchor="middle">Open</text>
  <text x="461" y="104" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#2D3748" text-anchor="middle">colpotomy</text>

  <!-- Electrosurgical TLH: bottom-right -->
  <circle cx="490" cy="180" r="8.5" fill="#8796A5"/>
  <text x="503" y="174" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#2D3748">Electrosurgical</text>
  <text x="503" y="185" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#2D3748">TLH</text>

  <!-- RUMI / V-Care: bottom-right lower -->
  <circle cx="465" cy="215" r="8" fill="#8796A5"/>
  <text x="478" y="210" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#2D3748">Manual cup</text>
  <text x="478" y="221" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#2D3748">(RUMI/V-Care)</text>

  <!-- Belotte Colpotomizer: bottom-left WHITE SPACE -->
  <circle cx="352" cy="200" r="11" fill="#41B3A3" filter="url(#glow)"/>
  <circle cx="352" cy="200" r="5" fill="#fff"/>
  <text x="368" y="195" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" font-weight="700" fill="#0E2A47">Belotte</text>
  <text x="368" y="207" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" font-weight="700" fill="#0E2A47">Colpotomizer™</text>

  <!-- ══════════════════════════════════════
       FOOTER BAR
  ══════════════════════════════════════ -->
  <rect x="0" y="264" width="540" height="46" fill="url(#hdr)"/>

  <!-- Legend -->
  <circle cx="14" cy="283" r="6" fill="#41B3A3" filter="url(#glow)"/>
  <circle cx="14" cy="283" r="3" fill="#fff"/>
  <text x="24" y="287" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="rgba(255,255,255,0.85)" font-weight="600">NEG+ device</text>
  <circle cx="100" cy="283" r="6" fill="#8796A5"/>
  <text x="110" y="287" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="rgba(255,255,255,0.72)">Existing alternatives</text>

  <!-- Moat text -->
  <text x="14" y="302" font-family="'Segoe UI',Arial,sans-serif" font-size="8" font-weight="700" fill="#41B3A3" font-style="italic">The moat: </text>
  <text x="68" y="302" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="rgba(255,255,255,0.82)">two purpose-built devices in two empty quadrants — protected by IP, regulatory pathway &amp; workflow simplicity.</text>
</svg>
