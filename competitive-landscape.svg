  <!-- Chart header -->
  <rect x="48" y="186" width="566" height="52" rx="6" fill="url(#headerGrad)"/>
  <rect x="48" y="210" width="566" height="28" fill="url(#headerGrad)"/>
  <!-- Syringe icon (simplified) -->
  <g transform="translate(70,204)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="16" x2="24" y2="0"/>
    <line x1="6" y1="19" x2="26" y2="7"/>
    <rect x="12" y="0" width="14" height="8" rx="2" transform="rotate(-33,19,4)" fill="#FFFFFF" stroke="none"/>
