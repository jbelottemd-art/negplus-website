  <text x="1148" y="493" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10" fill="#2D3748">colpotomy (TLH)</text>

  <!-- Manual cup (RUMI / V-Care): bottom-right, lower cost -->
  <circle cx="1090" cy="560" r="12" fill="#6B7C93"/>
  <text x="1108" y="553" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10" fill="#2D3748">Manual cup</text>
  <text x="1108" y="566" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10" fill="#2D3748">(RUMI / V-Care)</text>

