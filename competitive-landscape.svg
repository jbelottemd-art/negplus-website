<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0E2A47"/>
      <stop offset="100%" style="stop-color:#1B3F5C"/>
    </linearGradient>
    <linearGradient id="footerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#41B3A3"/>
      <stop offset="100%" style="stop-color:#2A9D8F"/>
    </linearGradient>
    <filter id="dotglow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="rgba(65,179,163,0.6)"/>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="rgba(0,0,0,0.13)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="760" fill="#FFFFFF"/>

  <!-- Top eyebrow bar -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#footerGrad)"/>

  <!-- ── HEADER ── -->
  <!-- Eyebrow label -->
  <text x="48" y="36" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#41B3A3" letter-spacing="3">COMPETITIVE LANDSCAPE  ·  THE MOAT</text>
  <!-- Heading line -->
  <line x1="48" y1="44" x2="200" y2="44" stroke="#41B3A3" stroke-width="1.5"/>

  <!-- Main title -->
  <text x="48" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="30" font-weight="800" fill="#0E2A47">The market has left the same quadrant open.</text>
  <text x="48" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="30" font-weight="800" font-style="italic" fill="#41B3A3">In both procedures.</text>

  <!-- Subtitle body -->
  <text x="48" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#4A5568" letter-spacing="0.1">Plotted on the two axes investors care about — cost per case and skill required — every existing alternative for both procedures clusters in the high-skill or high-cost half-plane.</text>
  <text x="48" y="165" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#4A5568">The low-skill / low-cost quadrant is empty.</text>

