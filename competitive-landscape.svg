  <text x="60" y="286" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9" font-weight="700" fill="#6B7C93" letter-spacing="1.5" transform="rotate(-90,60,286)">↑ COST PER CASE</text>
  <text x="72" y="272" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="8" fill="#9AA5B4" letter-spacing="1.5" writing-mode="tb">↑ COST PER CASE</text>

