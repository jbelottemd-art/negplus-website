  <circle cx="620" cy="447" r="6" fill="#7A8FA6"/>
  <text x="632" y="451" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10.5" fill="rgba(255,255,255,0.75)">Existing alternatives</text>

